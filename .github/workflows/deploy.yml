name: Build and deploy to RPi5

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: garak-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  GARAK_BASE_PATH: /garak
  GARAK_IMAGE: ghcr.io/facio313/garak
  GARAK_PUBLIC_URL: https://bonifacio.work/garak/
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and publish validated ARM64 image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      deploy_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate source identity
        id: source
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$VALIDATED_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$VALIDATED_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out validated source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        env:
          VALIDATED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$(git rev-parse HEAD)" == "$VALIDATED_SHA" ]]

      - name: Resolve portfolio authentication contract
        id: portfolio_auth
        env:
          PORTFOLIO_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -Eeuo pipefail
          PORTFOLIO_AUTH_MODE="$(scripts/portfolio-auth-mode.sh print)"
          printf 'branch=%s\nauth_mode=%s\n' \
            "$PORTFOLIO_BRANCH" "$PORTFOLIO_AUTH_MODE" >> "$GITHUB_OUTPUT"

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.event.workflow_run.actor.login }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build immutable ARM64 runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          pull: true
          tags: ${{ env.GARAK_IMAGE }}:${{ steps.source.outputs.sha }}
          build-args: |
            GARAK_BASE_PATH=${{ env.GARAK_BASE_PATH }}
            GARAK_PUBLIC_URL=${{ env.GARAK_PUBLIC_URL }}
            GIT_SHA=${{ steps.source.outputs.sha }}
            PORTFOLIO_BRANCH=${{ steps.portfolio_auth.outputs.branch }}
            PORTFOLIO_AUTH_MODE=${{ steps.portfolio_auth.outputs.auth_mode }}
          cache-from: type=gha,scope=garak-runtime
          cache-to: type=gha,mode=max,scope=garak-runtime

      - name: Smoke-test the exact runtime image
        env:
          GARAK_RUNTIME_IMAGE: ${{ env.GARAK_IMAGE }}:${{ steps.source.outputs.sha }}
          EXPECTED_AUTH_MODE: ${{ steps.portfolio_auth.outputs.auth_mode }}
          EXPECTED_BRANCH: ${{ steps.portfolio_auth.outputs.branch }}
          EXPECTED_REVISION: ${{ steps.source.outputs.sha }}
        run: .github/scripts/smoke-runtime-image.sh

      - name: Publish the smoke-tested immutable image
        env:
          GARAK_RUNTIME_IMAGE: ${{ env.GARAK_IMAGE }}:${{ steps.source.outputs.sha }}
        run: docker push "$GARAK_RUNTIME_IMAGE"

  deploy:
    name: Request restricted server deployment
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    steps:
      - name: Request restricted server deployment
        env:
          DEPLOY_ACTOR: ${{ github.event.workflow_run.actor.login }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_SHA: ${{ needs.publish.outputs.deploy_sha }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          trap 'rm -f "$HOME/.ssh/deploy_key"' EXIT

          printf '%s\n' \
            '[ssh.bonifacio.work]:22022 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII91ovdQZMg9NpUyjjFSS0Ra0SEuYuAw4Uv3GTv6J92F' \
            > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          {
            printf '%s\n' "$GHCR_TOKEN"
            printf '%s\n' "$DEPLOY_ACTOR"
          } | ssh -T \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -p 22022 \
            cks@ssh.bonifacio.work \
            "deploy garak $DEPLOY_SHA"
