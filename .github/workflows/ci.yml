name: Validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - anthropic
      - codex
      - "codex-feature-*"
      - cursor
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: garak-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate branch-bound authentication contract
        run: scripts/test-portfolio-auth-mode.sh

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test production build
        run: npm test

      - name: Validate production Compose configuration
        env:
          GARAK_IMAGE_TAG: "0000000000000000000000000000000000000000"
          PORTFOLIO_AUTH_MODE: sso
          PORTFOLIO_BRANCH: main
        run: docker compose -f docker-compose.prod.yml config --quiet
