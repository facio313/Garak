# Install inside the existing `server_name bonifacio.work` HTTPS server block.
# Keep the /garak prefix: the production image is built with that base path.
location = /garak {
    return 308 /garak/;
}

location ^~ /garak/ {
    include /etc/nginx/snippets/bonifacio-sso-authrequest.conf;

    proxy_pass http://127.0.0.1:5183;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /garak;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_intercept_errors on;
    error_page 502 503 504 =503 /_portfolio_unavailable.html;
}
